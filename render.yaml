# Render blueprint (docs/deploy.md). Create with: Render dashboard -> New -> Blueprint -> this repository.
services:
  - type: web
    name: grievance-lens
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      # Render's proxy appends the client address to X-Forwarded-For; check this after the first deploy
      # (docs/deploy.md, "Check the proxy setting").
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # TEMPORARY: echoes the caller's own address headers on /health to choose the proxy setting; remove after.
      - key: CLIENT_IP_DEBUG
        value: "true"
      # Optional LLM routing: leave LLM_PROVIDER unset to run offline (no key needed).
      # To use Gemini, uncomment these. Render then asks for the key's value when you apply the blueprint
      # (sync: false = the value is typed into the dashboard, never stored in this file or in git).
      # GEMINI_PAID_TIER=true is required in production: enable billing on the Google project first.
      # - key: LLM_PROVIDER
      #   value: gemini
      # - key: GEMINI_API_KEY
      #   sync: false
      # - key: GEMINI_PAID_TIER
      #   value: "true"
