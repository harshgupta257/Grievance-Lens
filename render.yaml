# Render blueprint (docs/deploy.md). Create with: Render dashboard -> New -> Blueprint -> this repository.
services:
  - type: web
    name: grievance-lens
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      # Visitor address for rate limiting, measured on Render on 2026-10-22 (docs/deploy.md, DESIGN.md D-053):
      # requests pass Cloudflare then Render's balancer. Cloudflare sets CF-Connecting-IP and blocks visitors who
      # send it themselves, so it is used first; X-Forwarded-For is [visitor, Cloudflare edge, Render balancer],
      # so the fallback is the 3rd entry from the right.
      - key: TRUSTED_CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: TRUSTED_PROXY_HOPS
        value: "3"
      # Kept explicitly off: Render's blueprint sync does not delete variables removed from this file, and this one
      # was on briefly to measure the proxy headers. Off = /health does not echo address headers.
      - key: CLIENT_IP_DEBUG
        value: "false"
      # Optional LLM routing: leave LLM_PROVIDER unset to run offline (no key needed).
      # To use Gemini, uncomment these. Render then asks for the key's value when you apply the blueprint
      # (sync: false = the value is typed into the dashboard, never stored in this file or in git).
      # GEMINI_PAID_TIER=true is required in production: enable billing on the Google project first.
      # - key: LLM_PROVIDER
      #   value: gemini
      # - key: GEMINI_API_KEY
      #   sync: false
      # - key: GEMINI_PAID_TIER
      #   value: "true"
