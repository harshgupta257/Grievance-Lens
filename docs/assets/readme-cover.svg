<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">Grievance Lens: an independent analytical report on CPGRAMS public grievance data</title>
  <desc id="d">Report-style cover with tricolour bands. Unofficial: not a publication of the Government of India.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#e7e2d4" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- paper -->
  <rect width="1200" height="340" fill="#fbf9f3"/>
  <rect width="1200" height="340" fill="url(#grid)" opacity=".55"/>
  <!-- tricolour band, top -->
  <rect y="0" width="1200" height="9" fill="#ff9933"/>
  <rect y="9" width="1200" height="9" fill="#ffffff"/>
  <rect y="18" width="1200" height="9" fill="#138808"/>
  <!-- left rule -->
  <rect x="56" y="62" width="5" height="214" fill="#0b2a6f"/>

  <text x="84" y="84" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="3" fill="#a24f00">AN INDEPENDENT ANALYTICAL REPORT · EDITION 2026</text>
  <text x="82" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700" fill="#0b2a6f">Grievance Lens</text>
  <text x="84" y="192" font-family="'Nirmala UI', 'Noto Sans Devanagari', 'Mangal', sans-serif" font-size="25" fill="#0b2a6f">लोक शिकायत आँकड़ों का स्वतंत्र विश्लेषण</text>
  <text x="84" y="232" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#2f3440">Public grievance data from 53 DARPG monthly CPGRAMS reports (May 2022 – Sep 2026)</text>
  <text x="84" y="258" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#2f3440">and an assistant that helps citizens prepare their own complaint.</text>

  <!-- right: report seal (abstract, no national symbols) -->
  <g transform="translate(948 70)">
    <rect width="190" height="206" rx="6" fill="#ffffff" stroke="#0b2a6f" stroke-width="2"/>
    <rect x="8" y="8" width="174" height="190" rx="3" fill="none" stroke="#0b2a6f" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="95" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="2" fill="#0b2a6f">DATA · METHODS</text>
    <!-- bar chart motif -->
    <g fill="#0b2a6f">
      <rect x="40" y="110" width="16" height="44" rx="2"/>
      <rect x="64" y="94" width="16" height="60" rx="2"/>
      <rect x="88" y="78" width="16" height="76" rx="2" fill="#138808"/>
      <rect x="112" y="98" width="16" height="56" rx="2"/>
      <rect x="136" y="70" width="16" height="84" rx="2" fill="#ff9933"/>
    </g>
    <line x1="32" y1="155" x2="160" y2="155" stroke="#2f3440" stroke-width="1.5"/>
    <text x="95" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2f3440">36,718 values</text>
    <text x="95" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5b6070">traced to report and page</text>
  </g>

  <!-- notice strip -->
  <rect x="0" y="296" width="1200" height="17" fill="#0b2a6f"/>
  <text x="600" y="308.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" letter-spacing="2.5" fill="#ffffff">UNOFFICIAL · NOT A PUBLICATION OF THE GOVERNMENT OF INDIA · NOT AFFILIATED WITH DARPG OR CPGRAMS</text>
  <!-- tricolour band, bottom -->
  <rect y="313" width="1200" height="9" fill="#ff9933"/>
  <rect y="322" width="1200" height="9" fill="#ffffff"/>
  <rect y="331" width="1200" height="9" fill="#138808"/>
</svg>
